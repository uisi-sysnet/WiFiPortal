<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[site_name]]</title>
<style>
  /* Only system fonts and inline images: nothing outside the walled garden
     loads before the user logs in. --accent and --ink also theme the form. */
  :root { --ink: #16242E; --accent: #0E7C66; --paper: #EEF2F0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--ink); color: #fff; text-align: center;
    padding: 32px 20px 84px;
  }
  header svg { display: block; margin: 0 auto 14px; }
  header h1 { margin: 0; font-size: 1.7rem; line-height: 1.2; letter-spacing: -0.01em; }
  header p { margin: 8px auto 0; max-width: 30ch; color: #B9CBC4; }
  main { max-width: 440px; margin: -60px auto 0; padding: 0 16px 28px; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(22, 36, 46, 0.12);
  }
  .card h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .card > p { margin: 0 0 18px; color: #56666E; font-size: 0.95rem; }
  footer { text-align: center; color: #56666E; font-size: 0.85rem; padding: 0 16px 32px; }
</style>
</head>
<body>
  <header>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3FC1A0" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16.3a5 5 0 0 1 6 0"/>
      <circle cx="12" cy="20" r="1.3" fill="#3FC1A0" stroke="none"/>
    </svg>
    <h1>[[site_name]]</h1>
    <p>Free internet for everyone. Log in once and you're connected.</p>
  </header>

  <main>
    <div class="card">
      <h2>Get connected</h2>
      <p>Residents can use their city ID. Visitors, enter your name and mobile number or email.</p>
      [[form]]
    </div>
  </main>

  <footer>Access point: [[router_name]]</footer>
</body>
</html>
