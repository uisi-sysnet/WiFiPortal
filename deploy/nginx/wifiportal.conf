# /etc/nginx/sites-available/wifiportal
#
# Phones on the hotspot open /portal/... over plain HTTP before they are logged in,
# and routers download /hotspot-files/.../login.html with /tool fetch. Keep port 80
# serving the app: if you add HTTPS (certbot), do NOT redirect all HTTP to HTTPS.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # or your domain, e.g. wifi.example.gov.ph

    root /var/www/wifiportal/public;
    index index.php;
    charset utf-8;

    # Splash page media uploads: videos up to 100 MB (config/hotspot.php)
    client_max_body_size 110M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Optimized photos and videos shown on the splash / advertisement page
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;      # "Test API connection" / "Read ports" wait on the router
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
